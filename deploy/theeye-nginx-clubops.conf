# Add these locations inside the existing server block for theeye.psgtech.ac.in.
# ClubOps listens on host port 8007 via docker-compose.prod.yml.

location = /clubops {
    return 301 /clubops/;
}

location ^~ /clubops/ {
    proxy_pass http://10.1.10.193:8007;
    proxy_redirect http://10.1.10.193:8007/ /clubops/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /clubops;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
